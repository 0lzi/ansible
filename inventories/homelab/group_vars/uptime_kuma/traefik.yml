---
uptime_kuma_version: 2

uptimekuma:
  traefik_labels:
    # uptime-kuma main interface
    traefik/http/routers/uptime-kuma/rule: "Host(`uptime.0lzi.com`)"
    traefik/http/routers/uptime-kuma/service: "uptime-kuma"
    traefik/http/routers/uptime-kuma/entrypoints: "websecure"
    traefik/http/routers/uptime-kuma/tls/certresolver: "cloudflare"
    traefik/http/routers/uptime-kuma/middlewares/0: "crowdsec@consul"
    traefik/http/routers/uptime-kuma/tls: "true"
    # uptime-kuma Service
    traefik/http/services/uptime-kuma/loadbalancer/servers/0/url: "http://docker-1.0lzi.com:3001"
    # uptime Metrics
    traefik/http/routers/uptime-metrics/rule: "Host(`uptime.0lzi.com`) && PathPrefix(`/metrics`)"
    traefik/http/routers/uptime-metrics/service: "uptime-metrics"
    traefik/http/routers/uptime-metrics/entrypoints: "websecure"
    traefik/http/routers/uptime-metrics/tls: "true"
    traefik/http/routers/uptime-metrics/middlewares/0: "crowdsec@consul"
    traefik/http/routers/uptime-metrics/middlewares/1: "http-rfc1918"
    traefik/http/services/uptime-metrics/loadbalancer/servers/0/url: "http://docker-1.0lzi.com:3001/metrics"
