- name: Check if Approle files exist
  ansible.builtin.stat:
    path: "{{ openbao_agent_config_dir }}/role_id"
  register: role_id_file

- name: Write Approle files
  when: not role_id_file.stat.exists
  block:
    - name: Get AppRole role_id
      ansible.builtin.uri:
        url: "{{ openbao_url }}/v1/auth/approle/role/{{ openbao_agent_approle_name }}/role-id"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('ansible.builtin.file', '~/.vault-token') }}"
        validate_certs: true
        return_content: true
      register: role_id_response
      delegate_to: localhost
      become: false

    - name: Set role_id fact
      ansible.builtin.set_fact:
        openbao_role_id: "{{ role_id_response.json.data.role_id }}"

    - name: Generate secret_id
      ansible.builtin.uri:
        url: "{{ openbao_url }}/v1/auth/approle/role/{{ openbao_agent_approle_name }}/secret-id"
        method: POST
        headers:
          X-Vault-Token: "{{ lookup('ansible.builtin.file', '~/.vault-token') }}"
        validate_certs: true
        return_content: true
        body_format: json
        body: {}
      register: secret_id_response
      delegate_to: localhost
      become: false

    - name: Set role_id fact
      ansible.builtin.set_fact:
        openbao_secret_id: "{{ secret_id_response.json.data.secret_id }}"

    - name: Write role_id file
      ansible.builtin.copy:
        dest: "{{ openbao_agent_config_dir }}/role_id"
        content: "{{ openbao_role_id }}"
        owner: root
        group: openbao
        mode: '0640'

    - name: Write secret_id file
      ansible.builtin.copy:
        dest: "{{ openbao_agent_config_dir }}/secret_id"
        content: "{{ openbao_secret_id }}"
        owner: root
        group: openbao
        mode: '0640'
      no_log: true
