---
- name: Pull latest gitlab container
  hosts: gitlab_server
  gather_facts: true
  become: true
  tasks:

    - name: Set services
      ansible.builtin.set_fact:
        service: "{{ gitlab_services__to_merge | first }}"

    - name: Pull Latest
      community.docker.docker_compose_v2_pull:
        project_src: "{{ base_dir }}/{{ service }}"
      register: gitlab_pull
